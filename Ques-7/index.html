<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="w-screen h-screen bg-yellow-100 flex justify-center items-center">
        <div class="w-[80%] p-8 rounded-xl border-2 border-orange-100 bg-white" id="quoteDiv">
            <p class="text-center font-bold text-3xl">Quote of the day</p>
            <p class="text-lg mt-6">❝ A tree is known by its fruit; a man by his deeds. A good deed is never lost; he who sows courtesy reaps friendship, and he who plants kindness gathers love. ❞</p>
            <p class="font-thin mt-6 italic">__ Basil of Caesarea</p>
            <div class="flex items-center  space-x-3 mt-6">
                <p class="font-semibold">Tags: </p>
                <button class="border-blue-600 border bg-blue-50 px-4 py-1 text-sm font-semibold rounded text-blue-600">Wisdom</button>
                <button class="border-blue-600 border bg-blue-50 px-4 py-1 text-sm font-semibold rounded text-blue-600">Friendship</button>
            </div>
            <button class="px-6 text-sm font-semibold rounded bg-blue-600 text-white py-2 mt-8 cursor-pointer">New Quote</button>
        </div>
    </div>

    <script>
        async function callApi(){
            await fetch("https://api.quotable.io/random").then(res => res.json()).then(data => console.log(data))
        }
        callApi();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
